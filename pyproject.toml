[project]
name = "evenpoint"
version = "0.1.0"
description = "Exports in, ROI out: find what to automate with AI, measured on your own data."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "litellm>=1.50",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
evenpoint = "evenpoint.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
